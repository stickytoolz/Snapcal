name: Build SnapCal IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project SnapCal.xcodeproj \
            -scheme SnapCal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/SnapCal.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SnapCal.app Payload/
          zip -qry SnapCal.ipa Payload
          ls -lh SnapCal.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapCal-ipa
          path: SnapCal.ipa

      - name: Publish release (easy download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" SnapCal.ipa \
            --title "SnapCal build ${{ github.run_number }}" \
            --notes "Download SnapCal.ipa below and sideload it." \
            --latest
